<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Videoflow · 界面风格预览</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0d0d0e;
      --panel: #19191a;
      --surface: #242426;
      --surface-raised: #2d2d2f;
      --hover: #323235;
      --line: #343437;
      --text: #f2f2f3;
      --secondary: #b7b7bc;
      --muted: #85858b;
      --blue: #1b9ff1;
      --blue-soft: #142c3d;
      --radius: 12px;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--page); color: var(--text); font-size: 14px; }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    svg { display: block; }
    .icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .shell { display: grid; grid-template-columns: 226px minmax(460px, 1fr) 360px; height: 100vh; }

    /* Navigation */
    .sidebar { display: flex; flex-direction: column; min-width: 0; overflow-y: auto; padding: 19px 12px 16px; border-right: 1px solid #252527; }
    .brand { height: 44px; display: flex; align-items: center; gap: 11px; padding: 0 10px; font-size: 16px; font-weight: 660; letter-spacing: .1px; }
    .brand-mark { width: 26px; height: 26px; filter: drop-shadow(0 1px 8px #168bea37); }
    .project-switcher { width: 100%; display: flex; align-items: center; gap: 10px; margin-top: 29px; padding: 10px; min-height: 52px; color: var(--text); background: var(--panel); border: 0; border-radius: 11px; text-align: left; }
    .project-switcher:hover, .nav-item:hover, .side-action:hover, .icon-button:hover { background: var(--hover); }
    .project-avatar { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: #dceeff; background: #27415b; font-weight: 700; }
    .project-copy { flex: 1; min-width: 0; }
    .project-copy strong, .project-copy span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-copy strong { font-size: 13px; font-weight: 620; }
    .project-copy span { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .section-label { margin: 29px 12px 10px; color: var(--muted); font-size: 12px; font-weight: 550; letter-spacing: .03em; }
    .nav-list { display: grid; gap: 3px; }
    .nav-item { display: flex; align-items: center; gap: 12px; width: 100%; height: 42px; padding: 0 12px; color: var(--secondary); background: transparent; border: 0; border-radius: 9px; text-align: left; font-weight: 510; }
    .nav-item.selected { color: var(--text); background: #29292b; }
    .nav-item.selected .icon { color: var(--blue); }
    .nav-item .count { margin-left: auto; color: var(--muted); font-size: 12px; }
    .nav-divider { height: 1px; margin: 19px 10px 0; background: #29292c; }
    .scene-list { display: grid; gap: 4px; }
    .scene { width: 100%; display: flex; align-items: center; gap: 9px; min-height: 38px; padding: 0 12px; color: var(--muted); background: transparent; border: 0; border-radius: 8px; text-align: left; font-size: 13px; white-space: nowrap; }
    .scene:hover { background: var(--hover); color: var(--text); }
    .scene.active { color: var(--text); background: #242426; }
    .scene-dot { width: 5px; height: 5px; flex: none; border-radius: 50%; background: #66666a; }
    .scene.active .scene-dot { background: var(--blue); box-shadow: 0 0 0 3px #1b9ff11c; }
    .sidebar-bottom { margin-top: auto; }
    .side-action { display: flex; align-items: center; gap: 11px; width: 100%; height: 42px; padding: 0 12px; color: var(--secondary); background: transparent; border: 0; border-radius: 9px; text-align: left; }
    .account { display: flex; align-items: center; gap: 10px; margin-top: 13px; padding: 12px 10px 3px; border-top: 1px solid #29292c; }
    .account-avatar { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: #483d3a; color: #e9d6ca; font-weight: 650; }
    .account-name { font-size: 13px; font-weight: 560; }
    .account-plan { margin-top: 3px; color: var(--muted); font-size: 12px; }

    /* Main workspace */
    .workspace { min-width: 0; overflow: auto; }
    .topbar { height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 32px; border-bottom: 1px solid #252527; }
    .breadcrumb { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--muted); white-space: nowrap; }
    .breadcrumb strong { color: var(--text); font-weight: 560; overflow: hidden; text-overflow: ellipsis; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .save-status { margin-right: 8px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .icon-button { width: 36px; height: 36px; display: grid; place-items: center; color: var(--secondary); background: transparent; border: 0; border-radius: 9px; }
    .main-content { max-width: 1050px; margin: 0 auto; padding: 38px 46px 48px; }
    .heading-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    .eyebrow { margin: 0 0 9px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; }
    h1 { margin: 0; font-size: clamp(23px, 2vw, 29px); line-height: 1.25; font-weight: 650; letter-spacing: -.025em; }
    .subline { margin: 10px 0 0; color: var(--secondary); font-size: 13px; }
    .small-action { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--secondary); background: var(--surface); border: 0; border-radius: 9px; white-space: nowrap; }
    .small-action:hover, .quiet-button:hover, .chip:hover { background: var(--hover); }
    .preview-card { overflow: hidden; background: var(--panel); border: 1px solid #303033; border-radius: 15px; box-shadow: 0 12px 36px #00000018; }
    .preview-art { position: relative; aspect-ratio: 16 / 8.1; overflow: hidden; background: #16202b; }
    .preview-art > svg { width: 100%; height: 100%; }
    .preview-art::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, transparent 68%, #07121db3 100%); }
    .video-badge { position: absolute; z-index: 1; left: 17px; top: 17px; padding: 7px 10px; color: #ededf0; background: #12161ac7; border-radius: 7px; font-size: 12px; }
    .play-button { position: absolute; z-index: 1; left: 50%; top: 50%; width: 54px; height: 54px; display: grid; place-items: center; transform: translate(-50%, -50%); color: white; background: #191b20c9; border: 1px solid #ffffff31; border-radius: 50%; backdrop-filter: blur(12px); }
    .play-button:hover { background: #2b2f36; }
    .play-button svg { margin-left: 3px; width: 20px; height: 20px; fill: currentColor; stroke: none; }
    .preview-caption { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 50px; padding: 0 18px; color: var(--secondary); font-size: 13px; }
    .preview-caption .resolution { color: var(--muted); }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 14px; }
    h2 { margin: 0; font-size: 16px; font-weight: 620; }
    .section-hint { color: var(--muted); font-size: 12px; }
    .prompt-panel { padding: 18px; background: var(--panel); border: 1px solid #2e2e31; border-radius: 14px; }
    .field-label { display: block; margin-bottom: 12px; color: var(--secondary); font-size: 13px; font-weight: 550; }
    .prompt-text { width: 100%; min-height: 93px; padding: 0; resize: vertical; color: var(--text); background: transparent; border: 0; outline: none; line-height: 1.72; }
    .prompt-text::placeholder { color: var(--muted); }
    .prompt-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; border-top: 1px solid #303033; }
    .prompt-options { display: flex; align-items: center; gap: 8px; }
    .chip { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px; color: var(--secondary); background: var(--surface); border: 0; border-radius: 8px; font-size: 12px; }
    .blue-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
    .primary-button { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 15px; color: #19191b; background: #f0f0f1; border: 0; border-radius: 9px; font-weight: 630; white-space: nowrap; box-shadow: 0 3px 12px #00000024; }
    .primary-button:hover { background: white; }
    .primary-button .icon { width: 16px; height: 16px; }

    /* Floating assistant */
    .assistant-zone { min-width: 0; padding: 11px 11px 11px 0; }
    .assistant { display: flex; flex-direction: column; height: 100%; overflow: hidden; background: #1d1d1f; border: 1px solid #2e2e31; border-radius: 20px; box-shadow: 0 12px 34px #0000003d; }
    .assistant-header { height: 58px; display: flex; align-items: center; justify-content: space-between; flex: none; gap: 12px; padding: 0 17px 0 21px; border-bottom: 1px solid #303033; }
    .assistant-title { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 640; }
    .spark { color: var(--blue); font-size: 18px; line-height: 1; }
    .assistant-thread { flex: 1; min-height: 0; overflow: auto; padding: 23px 19px 18px; }
    .thread-date { margin-bottom: 25px; color: var(--muted); text-align: center; font-size: 12px; }
    .user-bubble { width: fit-content; max-width: 92%; margin-left: auto; padding: 11px 14px; background: #303033; border-radius: 13px 13px 4px 13px; line-height: 1.65; }
    .reply { margin-top: 25px; }
    .reply-identity { display: flex; align-items: center; gap: 8px; color: var(--secondary); font-size: 12px; font-weight: 560; }
    .assistant-avatar { width: 22px; height: 22px; display: grid; place-items: center; color: #cbe8fc; background: #1b415d; border-radius: 7px; font-size: 13px; }
    .reply p { margin: 13px 0 0; color: #e2e2e5; line-height: 1.75; }
    .proposal { margin-top: 19px; padding: 15px; background: #28282a; border: 1px solid #343437; border-radius: 12px; }
    .proposal-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .proposal-title { font-size: 13px; font-weight: 610; }
    .proposal-status { color: #93c9ec; font-size: 12px; }
    .proposal p { margin: 10px 0 0; color: var(--secondary); font-size: 13px; line-height: 1.72; }
    .proposal-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 15px; }
    .quiet-button { min-width: 55px; height: 32px; padding: 0 10px; color: var(--secondary); background: transparent; border: 0; border-radius: 8px; font-size: 12px; }
    .apply-button { height: 32px; padding: 0 12px; color: #e5f4ff; background: #214a66; border: 0; border-radius: 8px; font-size: 12px; font-weight: 600; }
    .apply-button:hover { background: #2c5d80; }
    .assistant-compose { flex: none; margin: 10px 12px 12px; padding: 13px; background: #141415; border: 1px solid #303033; border-radius: 14px; }
    .assistant-compose textarea { display: block; width: 100%; min-height: 65px; resize: vertical; color: var(--text); background: transparent; border: 0; outline: none; line-height: 1.55; }
    .assistant-compose textarea::placeholder { color: #808086; }
    .compose-actions { display: flex; align-items: center; justify-content: space-between; }
    .compose-actions .icon-button { width: 31px; height: 31px; }
    .send-button { width: 31px; height: 31px; display: grid; place-items: center; color: #18181a; background: #ededee; border: 0; border-radius: 50%; }
    .send-button:hover { background: white; }
    .send-button .icon { width: 16px; height: 16px; }

    @media (max-width: 1200px) {
      .shell { grid-template-columns: 190px minmax(360px, 1fr) 320px; }
      .main-content { padding: 34px 26px; }
      .topbar { padding: 0 25px; }
    }
    @media (max-width: 950px) {
      .shell { grid-template-columns: 72px minmax(0, 1fr); min-height: 100vh; height: auto; }
      .sidebar { align-items: center; padding-inline: 10px; }
      .brand { padding: 0; }
      .brand-name, .project-switcher, .section-label, .nav-item span, .nav-item .count, .nav-divider, .scene-list, .sidebar-bottom { display: none; }
      .nav-list { margin-top: 28px; }
      .nav-item { width: 44px; justify-content: center; padding: 0; }
      .assistant-zone { grid-column: 2; padding: 0 18px 18px; }
      .assistant { min-height: 450px; max-height: 600px; }
    }
    @media (max-width: 600px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .topbar { height: 58px; padding: 0 16px; }
      .save-status { display: none; }
      .main-content { padding: 28px 16px; }
      .heading-row { align-items: flex-start; }
      .heading-row .small-action { display: none; }
      .assistant-zone { grid-column: 1; padding: 0 12px 12px; }
    }
  </style>
</head>
<body>
  <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M14 3.5V8h4M8 12h7M8 16h7"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m4 17 5.5-5 3.5 3 2.5-2 5 4"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M8 4v16M16 4v16M4 9h4m-4 6h4m8-6h4m-4 6h4"/></symbol>

    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5m-5 5 5-5 5 5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.2 6M20 5v6h-6"/></symbol>
  </svg>

  <div class="shell">
    <aside class="sidebar" aria-label="项目导航">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true"><path d="M4 2 29 12.5 16.4 17.1 7.6 31 9.1 17.6Z" fill="#189df0"/><path d="m16.4 17.1 12.6-4.6-8.4 16-13 2.5Z" fill="#0878d7"/><path d="m4 2 5.1 15.6 7.3-.5Z" fill="#43bdff"/></svg>
        <span class="brand-name">Videoflow</span>
      </div>
      <button class="project-switcher" type="button" aria-label="当前项目：雾港计划">
        <span class="project-avatar">雾</span>
        <span class="project-copy"><strong>雾港计划</strong><span>视频创作项目</span></span>
        <svg class="icon" aria-hidden="true"><use href="#i-down"/></svg>
      </button>
      <div class="section-label">工作区</div>
      <nav class="nav-list" aria-label="工作区">
        <button class="nav-item" type="button"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg><span>概览</span></button>
        <button class="nav-item" type="button"><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg><span>脚本</span></button>
        <button class="nav-item" type="button"><svg class="icon" aria-hidden="true"><use href="#i-image"/></svg><span>角色与素材</span></button>
        <button class="nav-item selected" type="button" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-film"/></svg><span>生成视频</span><span class="count">04</span></button>
      </nav>
      <div class="nav-divider"></div>
      <div class="section-label">片段</div>
      <div class="scene-list">
        <button class="scene" type="button"><span class="scene-dot"></span>01 · 雾中的街道</button>
        <button class="scene" type="button"><span class="scene-dot"></span>02 · 远处的灯塔</button>
        <button class="scene active" type="button"><span class="scene-dot"></span>03 · 桥下相遇</button>
        <button class="scene" type="button"><span class="scene-dot"></span>04 · 黎明之前</button>
      </div>
      <div class="sidebar-bottom">
        <button class="side-action" type="button"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>最近活动</button>
        <button class="side-action" type="button"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>项目设置</button>
        <div class="account"><span class="account-avatar">林</span><span><span class="account-name">林间创作</span><span class="account-plan">个人空间</span></span></div>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><span>雾港计划</span><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg><strong>生成视频</strong></div>
        <div class="top-actions"><span class="save-status">已保存</span><button class="icon-button" type="button" aria-label="更多选项"><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg></button></div>
      </header>
      <div class="main-content">
        <div class="heading-row">
          <div><p class="eyebrow">片段 03 / 视频生成</p><h1>桥下相遇</h1><p class="subline">雨夜里，两个人在桥下短暂相遇。</p></div>
          <button class="small-action" type="button"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>复制片段</button>
        </div>

        <div class="preview-card" aria-label="视频预览示意图">
          <div class="preview-art">

              </defs>
              <rect width="1200" height="608" fill="url(#sky)"/>

              <circle cx="824" cy="275" r="10" fill="#e0af76"/><circle cx="1004" cy="255" r="9" fill="#e0af76"/><circle cx="331" cy="281" r="8" fill="#d5a86e"/>
              <path d="M793 431q31 5 64 0M781 455q44 4 87 0M968 410q34 3 69 0M954 438q52 4 93-1M303 410q29 3 58 0" stroke="#d3a06a" stroke-width="5" opacity=".26"/>
              <path d="M650 395c8-32 16-47 26-47 14 0 24 22 30 48l17 92h-88z" fill="#111b24"/>
